plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.ian.openpebble'
    compileSdk 34

    defaultConfig {
        applicationId "dev.ian.openpebble"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Intentionally zero third-party dependencies: the Pebble protocol is vendored
// in PebbleBridge.kt and JSON is handled by the platform org.json library.
dependencies {
}